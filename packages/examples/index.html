<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glissade — showcase</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #0f1014; color: #e8e8ea; font: 14px/1.5 system-ui, sans-serif; }
      main { display: grid; gap: 14px; padding: 24px; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; }
      h1 span { color: #e6a700; }
      nav { display: flex; gap: 8px; flex-wrap: wrap; }
      nav button { background: #23262d; color: #e8e8ea; border: 0; border-radius: 999px;
                   padding: 6px 16px; cursor: pointer; font: inherit; }
      nav button:hover { background: #2e323b; }
      nav button.active { background: #e6a700; color: #15161a; font-weight: 600; }
      canvas { border-radius: 12px; background: #15161a; box-shadow: 0 16px 50px #000a;
               max-width: 92vw; height: auto; }
      .bar { display: flex; gap: 10px; align-items: center; }
      .bar button { background: #23262d; color: inherit; border: 0; border-radius: 8px;
                    padding: 6px 14px; cursor: pointer; font: inherit; }
      .bar input[type='range'] { flex: 1; accent-color: #e6a700; }
      .bar .time { font-variant-numeric: tabular-nums; color: #9aa0ab; min-width: 11ch; text-align: right; }
      p.blurb { margin: 0; color: #9aa0ab; max-width: 70ch; }
    </style>
  </head>
  <body>
    <main>
      <h1><span>glissade</span> showcase — widgets, loaders, screens, transitions <a href="/demo.html" style="font-size:12px;font-weight:400;color:#9aa0ab">(minimal demo →)</a></h1>
      <nav id="picker"></nav>
      <canvas id="stage" width="800" height="450"></canvas>
      <div class="bar">
        <button id="playpause">Pause</button>
        <input type="range" id="scrub" min="0" max="1" step="0.0001" value="0" />
        <span class="time" id="time"></span>
      </div>
      <p class="blurb" id="blurb"></p>
    </main>
    <script type="module" src="/src/showcase.ts"></script>
  </body>
</html>
