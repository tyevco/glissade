# Publish pipeline (DESIGN.md §7.4): changesets + npm provenance.
# Inert until the @glissade npm org exists and NPM_TOKEN is set as a
# repo secret; then: merge the changesets "Version Packages" PR (or run
# `pnpm changeset version` locally) and dispatch this workflow.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-deps.mjs
      - run: node scripts/check-size.mjs
      # changesets@2.31.0 (the latest) can crash in its POST-publish
      # isAlreadyPublishedError check (`error.message.includes` on undefined)
      # AFTER packages actually published — reddening a successful release.
      # Tolerate that case: a non-zero exit is only a real failure when the
      # "packages published successfully" marker is absent from the output.
      - name: Publish (tolerate the known changesets post-publish crash)
        run: |
          set +e
          pnpm changeset publish 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q "packages published successfully" publish.log; then
            echo "::warning::changeset publish exited $code after a successful publish (known changesets@2.31.0 isAlreadyPublishedError post-publish crash); treating as success"
            exit 0
          fi
          exit "$code"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
