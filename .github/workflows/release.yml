# Publish pipeline (DESIGN.md §7.4): changesets + npm provenance.
# Inert until the @glissade npm org exists and NPM_TOKEN is set as a
# repo secret; then: merge the changesets "Version Packages" PR (or run
# `pnpm changeset version` locally) and dispatch this workflow.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # build the @glissade/browser IIFE BEFORE publish so dist/glissade.browser.js
      # ships in the npm tarball (dist is gitignored) AND can attach to the Release.
      - run: pnpm build:browser
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-deps.mjs
      - run: node scripts/check-size.mjs
      - run: node scripts/api-report.mjs # keep release gated on the same surface checks as ci.yml (this drifted silently across 0.26-0.32)
      # changesets@2.31.0 (the latest) can crash in its POST-publish
      # isAlreadyPublishedError check (`error.message.includes` on undefined)
      # AFTER packages actually published — reddening a successful release.
      # Tolerate that case: a non-zero exit is only a real failure when the
      # "packages published successfully" marker is absent from the output.
      - name: Publish (tolerate the known changesets post-publish crash)
        run: |
          set +e
          pnpm changeset publish 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q "packages published successfully" publish.log; then
            echo "::warning::changeset publish exited $code after a successful publish (known changesets@2.31.0 isAlreadyPublishedError post-publish crash); treating as success"
            exit 0
          fi
          exit "$code"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Tag the release commit + create a GitHub Release (notes from the umbrella
      # CHANGELOG) with the browser IIFE attached as an asset. Lockstep: one
      # v<version> tag/release per cut (NOT changeset's per-package tags).
      # Prereleases (0.X.0-pre.N) are marked --prerelease and never become Latest.
      - name: Tag + GitHub Release (browser bundle attached)
        run: |
          VERSION=$(node -p "require('./packages/umbrella/package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists; skipping"
            exit 0
          fi
          # notes: the release commit's body (the rich "Version Packages" summary);
          # fall back to the umbrella CHANGELOG section, then a stub.
          git log -1 --format=%b > notes.md
          if [ ! -s notes.md ]; then
            awk -v v="## ${VERSION}" '$0==v {f=1;next} /^## / && f {exit} f {print}' \
              packages/umbrella/CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || echo "glissade ${VERSION} (lockstep, Apache-2.0). See package CHANGELOGs." > notes.md
          case "$VERSION" in
            *-pre.*|*-rc.*|*-beta.*|*-alpha.*) FLAGS="--prerelease --latest=false" ;;
            *) FLAGS="--latest" ;;
          esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file notes.md $FLAGS \
            packages/browser/dist/glissade.browser.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
