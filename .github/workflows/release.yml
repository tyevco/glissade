# Publish pipeline (DESIGN.md §7.4): changesets + npm provenance.
# Inert until the @glissade npm org exists and NPM_TOKEN is set as a
# repo secret; then: merge the changesets "Version Packages" PR (or run
# `pnpm changeset version` locally) and dispatch this workflow.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-deps.mjs
      - run: node scripts/check-size.mjs
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
