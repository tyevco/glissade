# Docs site + hosted showcase (the launch card): VitePress over docs/ at the
# site root, the examples gallery at /demo/app/. The demo nests one level deep
# so scene-module asset URLs ('../../assets/…', page-relative in browsers,
# module-relative on the CLI) resolve to /glissade/assets within the artifact.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitepress build docs
      - run: pnpm --filter @glissade/examples exec vite build --base=/glissade/demo/app/
      - name: Compose site
        run: |
          mkdir -p site/demo
          cp -r docs/.vitepress/dist/* site/
          cp -r packages/examples/dist site/demo/app
          cp -r packages/examples/assets site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
