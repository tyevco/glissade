name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint # determinism rules (@glissade/eslint-plugin) on core/scene src
      - run: pnpm test
      - run: node scripts/check-deps.mjs
      - run: node scripts/check-size.mjs
      - run: node scripts/check-types.mjs # attw: published type resolution (esm-only profile)
      - run: node scripts/api-report.mjs # api-extractor: committed *.api.md surface is current

  browser-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # jiti-loaded scene modules resolve workspace deps to built dist/
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: sudo apt-get install -y ffmpeg
      - run: PARITY=1 pnpm vitest run packages/backend-skia/test/parity.test.ts
      - run: EXPORT=1 pnpm vitest run packages/backend-skia/test/export-web.test.ts
      - run: INTERACT=1 pnpm vitest run packages/cli/test/interact-e2e.test.ts
      - run: PLAYER=1 pnpm vitest run packages/player/test/player-e2e.test.ts
      - run: ELEMENT=1 pnpm vitest run packages/element/test/element-e2e.test.ts
      - run: STUDIO=1 pnpm vitest run packages/studio/test/studio-e2e.test.ts
