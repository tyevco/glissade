name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-deps.mjs
      - run: node scripts/check-size.mjs

  browser-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # jiti-loaded scene modules resolve workspace deps to built dist/
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: sudo apt-get install -y ffmpeg
      - run: PARITY=1 pnpm vitest run packages/backend-skia/test/parity.test.ts
      - run: EXPORT=1 pnpm vitest run packages/backend-skia/test/export-web.test.ts
